# Access Control System Example Configuration
# Following specification: @specs/draft/access-control-system.md

# 1. Roles Definition (RBAC & Inheritance)
roles:
  # Base role with minimal access
  base_user:
    inheritance: null
    permissions:
      - resource: "public_assets"
        actions: ["view"] # Synonym for Read
        clearance: level_3_public # Public
  
  # Department Manager role
  department_manager:
    inheritance: "base_user"
    permissions:
      - resource: "project_data"
        actions: ["view", "export"] # Synonyms for Read
        clearance: level_2_internal # Internal / Private
      - resource: "finance_reports"
        actions: ["view"] # View only, cannot modify
        clearance: level_1_secret # Secret / Confidential

  # Accountant role (More specific finance access)
  accountant:
    inheritance: "base_user"
    permissions:
      - resource: "finance_data"
        actions: ["view", "modify", "add"] # Synonyms for Read, Update, Create
        clearance: level_0_top_secret # Top Secret / Restricted (Full visibility)
      - resource: "audit_logs"
        actions: ["view", "export", "backup"] # synonyms for Read
        clearance: level_0_top_secret

  # Legal Consultant role
  legal_consultant:
    inheritance: "base_user"
    permissions:
      - resource: "legal_contracts"
        actions: ["view", "export", "modify"]
        clearance: level_2_internal

  # Legal Reviewer role (Can approve changes to legal contracts)
  legal_reviewer:
    inheritance: "legal_consultant"
    permissions:
      - resource: "legal_contracts"
        actions: ["view", "modify", "approve"]
        clearance: level_1_secret # Higher clearance allows modification and approval

  # Auditor role (Restricted visibility for certain data)
  auditor:
    inheritance: "base_user"
    permissions:
      - resource: "finance_reports"
        actions: ["view"]
        clearance: level_4_restricted # Explicit prohibition
      - resource: "audit_logs"
        actions: ["view"]
        clearance: level_1_secret

  # Admin role
  admin:
    inheritance: "department_manager"
    permissions:
      - resource: "all_resources"
        actions: ["view", "modify", "add", "remove", "restore"]
        clearance: level_0_top_secret

# 2. Scopes Definition (SBAC)
scopes:
  onboarding:
    permissions:
      - resource: "all_resources"
        actions: ["view"] # Only Read, regardless of role permissions
        clearance_limit: level_3_public # Clearance capped at Public

# 3. Users Definition
users:
  user_001:
    name: "Alice Finance"
    roles: ["accountant"]
    clearance: level_0_top_secret
    scopes: []

  user_002:
    name: "Bob Manager"
    roles: ["department_manager"]
    clearance: level_1_secret
    scopes: []

  user_004:
    name: "Guest Admin"
    roles: ["admin"]
    clearance: level_3_public
    scopes: []

  user_005:
    name: "Legal Assistant"
    roles: ["legal_consultant"]
    clearance: level_2_internal
    scopes: []

  user_007:
    name: "Senior Legal Counsel"
    roles: ["legal_reviewer"]
    clearance: level_0_top_secret
    scopes: []

  user_006:
    name: "External Auditor"
    roles: ["auditor"]
    clearance: level_3_public
    scopes: []

  user_008:
    name: "New Admin Trainee"
    roles: ["admin"]
    clearance: level_0_top_secret # High trust, but capped by scope
    scopes: ["onboarding"]

# 4. Resources and Intent-Based Action Definitions
resources:
  public_assets:
    paths: ["/public/**"]
    confidentiality: level_3_public
  
  project_data:
    paths: ["/projects/*", "/projects/alpha-secret"]
    confidentiality: level_1_secret
  
  finance_reports:
    paths: ["/finance/reports/*", "/finance/reports/salary-2024"]
    confidentiality: level_0_top_secret
    actions:
      - name: ExportTaxReport
        baseOperation: Read
        minIntegrityLevel: level_2_internal
        requiresMultiPerson: false
        audit: true

  finance_data:
    paths: ["/finance/**"]
    confidentiality: level_0_top_secret
    actions:
      - name: ReleasePayment
        baseOperation: Update
        minIntegrityLevel: level_1_secret
        requiresMultiPerson: false
        audit: true
        parameters: [amount, departmentId]
      - name: VoidTransaction
        baseOperation: Delete
        minIntegrityLevel: level_0_top_secret
        requiresMultiPerson: true
        audit: true

  audit_logs:
    paths: ["/finance/audit-logs"]
    confidentiality: level_0_top_secret

  all_resources:
    paths: ["/**"]
    confidentiality: level_0_top_secret

  legal_contracts:
    paths: ["/legal/contracts/*"]
    confidentiality: level_1_secret
    approval_threshold: 1 # Requires at least one approval for "Write Up" or high-integrity changes
    actions:
      - name: ApproveContract
        baseOperation: Update
        minIntegrityLevel: level_1_secret
        requiresMultiPerson: true
        audit: true

  user_management:
    paths: ["/users/*"]
    confidentiality: level_2_internal
    actions:
      - name: Impersonate
        baseOperation: Execute
        minIntegrityLevel: level_0_top_secret
        requiresMultiPerson: false
        audit: true
      - name: ResetPassword
        baseOperation: Update
        minIntegrityLevel: level_2_internal
        requiresMultiPerson: false
        audit: false
        requiresMFA: true

# 5. Visibility and Access Evaluation Examples
# - **Example 1 (Guest Admin accessing all resources)**:
#   - User Clearance: level_3_public. Role: admin (level_0_top_secret).
#   - Result: Visibility capped at level_3_public (Anonymized).
#
# - **Example 2 (Department Manager accessing finance_reports)**:
#   - User Clearance: level_1_secret. Role: department_manager (level_1_secret).
#   - Resource: finance_reports (level_0_top_secret).
#   - Result: Visibility level_1_secret (Partial Masking / FPE).
#
# - **Example 3 (Biba Integrity and Approval Workflow)**:
#   - User "Legal Assistant" (level_2_internal) attempts to modify (Update) a contract.
#   - Resource "legal_contracts" is level_1_secret (Confidentiality/Integrity).
#   - Result: Change is NOT immediately applied (Pending) due to "Write Up".
#   - Requirement: Approval by someone with level_1_secret or higher (e.g., Senior Legal Counsel).
#
# - **Example 4 (Path Precedence)**:
#   - Request: /finance/reports/salary-2024
#   - Matches: /finance/** (finance_data) and /finance/reports/* (finance_reports)
#   - Result: finance_reports applies (Longest matching prefix).
