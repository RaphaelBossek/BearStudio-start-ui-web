<svg xmlns="http://www.w3.org/2000/svg" id="Ebene_2" data-name="Ebene 2" viewBox="0 0 382.93 328.26" class="mascot-error">
  <defs>
    <style>
      .cls-1 { 
        fill: #e74c3c; 
        animation: error-pulse 1.5s ease-in-out infinite;
      }
      .error-glow {
        fill: #ff6b6b;
        opacity: 0.4;
        filter: blur(8px);
      }
      
      @keyframes error-pulse {
        0%, 100% { 
          fill: #e74c3c;
          transform: scale(1);
        }
        50% { 
          fill: #ff4757;
          transform: scale(1.05);
        }
      }
      
      @keyframes error-wobble {
        0%, 100% { transform: translateX(0) rotate(0deg); }
        25% { transform: translateX(-3px) rotate(-2deg); }
        75% { transform: translateX(3px) rotate(2deg); }
      }
      
      .mascot-error {
        animation: error-wobble 0.6s ease-in-out infinite;
      }
    </style>
  </defs>
